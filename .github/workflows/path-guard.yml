name: path-guard

on:
  pull_request:
    branches:
      - main
      - sprint-*

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: path-guard
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Check changed paths through remote PR files
        run: |
          set -euo pipefail
          files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          if ! printf '%s' "$AUTHOR" | grep -qE '\[bot\]$'; then
            echo "::notice::Human author ${AUTHOR}; .github/** changes allowed"
            exit 0
          fi

          touched="$(printf '%s\n' "$files" | grep -E '^\.github/' || true)"
          if [ -n "$touched" ]; then
            echo "::error::Bot author ${AUTHOR} cannot modify .github/** paths"
            printf '%s\n' "$touched"
            exit 1
          fi

          echo "No bot-authored .github/** path changes detected"
